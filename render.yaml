services:
  - type: web
    name: marketplace-articles
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: require
      - key: ADMIN_PASSWORD
        sync: false
